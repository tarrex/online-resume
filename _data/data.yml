# This file is both the example site's data and a guide to writing your resume.
# Replace the placeholder values with your own information and remove fields or
# entire sections that you do not need. Empty optional fields are not displayed.
#
# For each section:
# - show controls whether the section is displayed.
# - order controls its position; lower numbers appear first.
# - title is the heading shown on the resume.
# - summary supports Markdown. In this guide, it explains how to use the section;
#   replace it with your own content or leave it empty in your finished resume.
# In item lists, link is optional; use a complete URL or leave it empty. Keep date
# formats consistent throughout the resume (for example, YYYY.MM - YYYY.MM).
updated: "2026-08-27"         # Last updated date in YYYY-MM-DD format; omit it to use the build date
variation: jobhunt-type1      # Controls which part to show.
  # Add current variation into 'show' variable of a section to show the section in current variation of resume
  # section with 'show' variable set to true will be shown no matter what current variation we are in

name: Foo Bar                 # Your full name
title: Backend Developer      # Your current or target job title
headshot:
  - show: true
  - path: images/profile.png  # File path or URL for your headshot

# Contact values support three forms:
# 1. Account or ID: github: octocat (the known platform URL is added automatically).
# 2. Plain text: location: Beijing, China (used when no automatic URL is defined).
# 3. Markdown link: location: '[Beijing, China](https://maps.example.com/...)'.
#    Use this form for a custom label or URL; the value must begin with "[".
# Keep only the contact methods you want to publish. Do not paste a full URL into
# an account/ID field unless you use the Markdown-link form.
contact:
  - location: Beijing, China  # Plain text or a Markdown link
  - email: me@example.com     # Address only; "mailto:" is added automatically
  - phone: +86-111-2222-3333  # Use international format; "tel:" is added automatically
  - website: example.com      # Omit http(s)://; "https://" is added automatically

  - gender:                   # Gender or pronouns; include only if relevant
  - birthday:                 # Date of birth; consider local norms and privacy
  - nationality:              # Nationality or citizenship
  - visa:                     # Visa or work-authorization status
  - driver_license:           # Driver's licence class or status

  # For the platforms below, enter only the <placeholder> part shown in the
  # comment unless it explicitly asks for a Markdown link. The theme builds the
  # full URL automatically only for platforms with a stable profile URL.

  # programming
  - github:                   # https://github.com/<user>
  - gitlab:                   # https://gitlab.com/<user>; use Markdown for a self-hosted instance
  - gitea:                    # https://gitea.com/<user>; use Markdown for a self-hosted instance
  - gitee:                    # https://gitee.com/<user>
  - bitbucket:                # https://bitbucket.org/<user>
  - leetcode:                 # https://leetcode.com/<user>
  - codeforces:               # https://codeforces.com/profile/<user>
  - codewars:                 # https://www.codewars.com/users/<user>
  - topcoder:                 # https://www.topcoder.com/members/<user>
  - huggingface:              # https://huggingface.co/<user>
  - tryhackme:                # https://tryhackme.com/p/<user>
  - hackerone:                # https://hackerone.com/<user>

  # research
  - googlescholar:            # https://scholar.google.com/citations?user=<user>, user ID from the profile URL's citations?user=<id>
  - researchgate:             # https://www.researchgate.net/profile/<user>
  - orcid:                    # https://orcid.org/<id>
  - figshare:                 # https://figshare.com/authors/<name/id>, <name>/<numeric-id> from the profile's /authors/ path
  - kaggle:                   # https://www.kaggle.com/<user>

  # writing
  - medium:                   # https://medium.com/@<user>
  - devto:                    # https://dev.to/<user>

  # creativity
  - figma:                    # https://www.figma.com/@<user>
  - behance:                  # https://www.behance.net/<user>
  - dribbble:                 # https://dribbble.com/<user>
  - artstation:               # https://www.artstation.com/<user>
  - pixiv:                    # https://www.pixiv.net/users/<id>
  - pinterest:                # https://www.pinterest.com/<user>
  - producthunt:              # https://www.producthunt.com/@<user>

  # cv
  - linkedin:                 # https://linkedin.com/in/<user>
  - indeed:                   # Markdown link using the share URL generated by Indeed
  - xing:                     # https://www.xing.com/profile/<user>
  - fiverr:                   # https://www.fiverr.com/<user>
  - freelancer:               # https://www.freelancer.com/u/<user>
  - aboutme:                 # https://about.me/<user>
  - linktree:                 # https://linktr.ee/<user>

  # chat
  - wechat:                   # WeChat ID, plain text, or a Markdown link
  - whatsapp:                 # https://wa.me/<country-code-and-number>; digits only, without + or punctuation
  - telegram:                 # https://t.me/<user>
  - messenger:                # https://m.me/<user>
  - line:                     # https://line.me/R/ti/p/@<lineid>, LINE Official Account ID without @; the theme adds it
  - viber:                    # Viber share URL as a Markdown link, or plain text
  - threema:                  # https://threema.id/<userid>
  - signal:                   # Signal username, plain text, or a Markdown link
  - wire:                     # Wire username, plain text, or a Markdown link

  # social
  - stackoverflow:            # https://stackoverflow.com/users/<id>
  - stackexchange:            # https://stackexchange.com/users/<id>
  - quora:                    # https://www.quora.com/profile/<user>
  - zhihu:                    # https://www.zhihu.com/people/<user>
  - goodreads:                # https://www.goodreads.com/user/show/<user>
  - strava:                   # https://www.strava.com/athletes/<id>
  - wikipedia:                # Markdown link to the user page on the relevant wiki
  - x:                        # https://x.com/<user>
  - mastodon:                 # Mastodon user@server, plain text, or a Markdown link
  - bluesky:                  # https://bsky.app/profile/<user>
  - threads:                  # https://www.threads.net/@<user>
  - vk:                       # https://vk.com/<user>
  - sinaweibo:                # Sina Weibo user, plain text, or a Markdown link
  - instagram:                # https://instagram.com/<user>
  - unsplash:                 # https://unsplash.com/@<user>
  - 500px:                    # https://500px.com/p/<user>
  - youtube:                  # https://www.youtube.com/@<user>
  - tiktok:                   # https://www.tiktok.com/@<user>

profile:
  show: true
  order: 1
  title: Profile
  summary: |
    The profile section in a resume is a brief summary of the applicant's skills, qualifications, and experience. The purpose of this section is to provide a snapshot of the applicant's professional background and highlight their most relevant accomplishments and strengths. It may include information such as the applicant's career objectives, years of experience, areas of expertise, and key achievements.

    A well-crafted profile section can help to grab the attention of potential employers and encourage them to read on and learn more about the applicant's qualifications and experience.

experience:
  show: true
  order: 2
  title: Experiences
  summary: |
    The experiences section in a resume is a section where you list your previous work experiences and accomplishments. It typically includes information about your previous job titles, companies you worked for, the dates of your employment, and your key responsibilities and achievements in each role. This section is important because it gives potential employers a sense of your work history and the skills and expertise you have developed over time. It can also help demonstrate your ability to contribute value to a new organization based on your past achievements.

  items:
    - company: Second Company
      show: true
      link: https://example.com/link/to/second-company
      tags: Full-time
      date: 2018.03 - 2019.03
      role: Backend Developer
      location: Beijing
      summary: |
        Your key responsibilities and achievements in the company.
        + First
        + Second

    - company: First Company
      show: true
      link:
      tags: Part-time, remote
      date: 2017.03 - 2018.03
      role: Backend Developer
      location: Beijing
      summary: |
        Your key responsibilities and achievements in the company.
        + First
        + Second

project:
  show: true
  order: 3
  title: Projects
  summary: |
    The project section in a resume is a section where you can highlight any significant projects that you have completed during your education, work experience, or personal endeavors. This section provides a detailed description of your projects that can showcase your skills, abilities, and achievements.

    In this section, you should include the name of the project, the role you played in the project, the duration, the tools and technologies you used, the objective of the project, and the outcome or result achieved. You can also include any relevant metrics or data that demonstrate the impact of the project.

    The project section is especially useful for candidates with limited work experience or those looking to highlight specific skills or accomplishments that may not be apparent in other parts of their resume. It can also be beneficial for candidates in technical or creative fields, where projects play a significant role in showcasing their capabilities.

  items:
    - name: Personal project
      show: true
      link: https://example.com/link/to/personal-project
      tags:
      date: 2015 - 2017
      summary: |
        Personal project description...
        + First
        + Second

    - name: OSS project
      show: true
      link:
      tags: committer
      date:
      summary: |
        OSS project description...
        + First
        + Second

skill:
  show: true
  order: 4
  title: Skills
  summary: |
    The skills section in a resume is a dedicated section where you can list out the various skills that you possess that are relevant to the job you are applying for. This section allows you to highlight your strengths and demonstrate your capabilities to potential employers.

    The skills section can include both hard skills and soft skills. Hard skills are specific technical abilities or knowledge related to a particular job or industry, such as proficiency in programming languages or experience with certain software programs. Soft skills are more general personal traits and abilities, such as communication skills, leadership, problem-solving, or teamwork.

    When crafting your skills section, it's important to tailor it to the specific job you are applying for, and only include skills that are relevant to the position. This can help catch the attention of the hiring manager and demonstrate that you have the qualifications necessary to succeed in the role.

    There are multiple ways to present your skills here. One way is to show them in a rating format. Another way is to group them together. Alternatively, you can use markdown to format it in a way that you prefer.

  # Use items, groups, or both. When both are present, both are displayed.
  # Levels 1–5 correspond to Beginner / Amateur / Competent / Proficient / Expert
  items:
    - name: Skill A
      show: true
      level: 5
    - name: Skill B
      show: true
      level: 4
    - name: Skill C
      show: true
      level: 3
    - name: Skill D
      show: true
      level: 4
    - name: Skill E
      show: true
      level: 3
    - name: Skill F
      show: true
      level: 1
    - name: Skill G
      show: true
      level: 4
    - name: Skill H
      show: true
      level: 4
    - name: Skill I
      show: true
      level: 3

  groups:
    - name: Group A Skills
      show: true
      item:
        - Skill A
        - Skill B
        - Skill C
        - Skill D
    - name: Group B Skills
      show: true
      item:
        - Skill E
        - Skill F
        - Skill G
    - name: Group C Skills
      show: true
      item:
        - Skill H
        - Skill I

education:
  show: true
  order: 5
  title: Education
  summary: |
    The education section in a resume is where you provide information about your academic background, including any degrees. In this section, you should include the name and location of the institution where you received your degree, the name of the degree or program you completed, and the date of graduation. If you have earned multiple degrees, list them in reverse chronological order, with the most recent degree first.

    In addition to basic information about your education, you may also want to include any academic honors or awards you received, relevant coursework or projects, and your GPA if it is 3.0 or above. If you have recently graduated and do not have much work experience yet, highlighting your education and academic achievements can help demonstrate your potential to succeed in the workplace.

  items:
    - institution: Example University
      show: true
      link: https://example.com/link/to/example-university
      date: 2015 - 2018
      major: Machine Learning
      degree: Master
      summary: |
        Additional information for this institution.
        + First
        + Second

    - institution: Example University
      show: true
      link:
      date: 2011 - 2015
      major: Computer Science
      degree: Bachelor
      summary: |
        Additional information for this institution.
        + First
        + Second

course:
  show: true
  order: 6
  title: Courses
  summary: |
    Include only substantial courses that are relevant to the target role and add knowledge not already clear from your education or certifications. Give the course name, provider, completion date, and a credential link when available.
  items:
    - name: Example Course One
      show: true
      institution: by Example
      date: 2022
      link: https://example.com/link/to/example-course-one
      summary: |
        It's my Example Course One by Example.
    - name: Example Course Two
      show: true
      institution: by Example
      date: 2022
      link:
      summary: |
        It's my Example Course Two by Example.

certificate:
  show: true
  order: 7
  title: Certificates
  summary: |
    The certificate section in a resume is a dedicated section where you can showcase any additional certifications or specialized training you have received. This section provides potential employers with a more complete picture of your skills and expertise, and can help you stand out from other candidates.

    Certificates can come from a variety of sources, such as online courses, workshops, or professional development programs. Examples of certificates that might be relevant to include on your resume could include certifications in a particular software or technology, industry-specific certifications, or certifications related to a specific skill or area of expertise.

    When including your certificates in your resume, be sure to provide the name of the certification, the institution or organization that issued it, and the date it was issued. You may also want to include a brief description of the skills or knowledge that the certification demonstrates.

    The certificate section of your resume should be tailored to the specific job you are applying for, and should only include certifications that are relevant to the position. By highlighting your certifications, you can demonstrate your commitment to professional development and your expertise in a particular area.

  items:
    - name: Example Certificate One
      show: true
      issuer: by Example
      date: 2020
      link: https://example.com/link/to/example-certificate-one
      summary: |
        It's my Example Certificate One by Example.
    - name: Example Certificate Two
      issuer: by Example
      date: 2020
      link:
      summary: |
        It's my Example Certificate Two by Example.

publication:
  show: true
  order: 8
  title: Publications
  summary: |
    The publication section in a resume is a dedicated section where you can showcase any publications that you have authored or contributed to. This section is particularly relevant for individuals in academic or research fields, but can also be relevant for individuals in other fields who have published articles or papers.

    Publications can include academic journal articles, conference papers, book chapters, reports, or other written works. In this section, you should list the title of the publication, the names of any co-authors, the name of the publication or conference, the date of publication, and any other relevant details.

    If you have a long list of publications, you may want to consider including only the most relevant or significant publications on your resume. Alternatively, you could create a separate publication list and provide it as a separate document, either in your application materials or upon request.

    Including a publication section in your resume can help demonstrate your expertise and credibility in your field, and can help you stand out from other candidates. However, if you do not have any publications to list, it is not necessary to include this section in your resume.

  items:
    - title: Example Publication in Action
      show: true
      authors: Foo Bar
      conference: Foobar, 2019
      link: https://example.com/link/to/example-publication-in-action
    - title: The Art of Example Publication
      show: true
      authors: Foo Bar
      conference: Foobar, 2019
      link:

award:
  show: true
  order: 9
  title: Awards
  summary: |
    The award section in a resume is a dedicated section where you can showcase any awards you have received. This section is particularly relevant for individuals who have received awards for their work in their field, such as employees who have received performance awards or industry-specific awards. In this section, you should list the name of the award, the organization or institution that awarded it, the date it was awarded, and any other relevant details.

    When including your awards on your resume, be sure to focus on the most significant or relevant awards that showcase your skills and expertise. If you have received a long list of awards, you may want to consider including only the most recent or prestigious awards on your resume.

    By highlighting your awards, you can demonstrate your achievements and accomplishments in your field, and can help differentiate yourself from other candidates. However, if you have not received any awards, it is not necessary to include this section in your resume.

  items:
    - name: Example Award One
      show: true
      awarder: by Example
      date: 2022
      link: https://example.com/link/to/example-award-one
      summary: |
        It's my Example Awared One by Example.
    - name: Example Award Two
      show: true
      awarder: by Example
      date: 2022
      link:
      summary: |
        It's my Example Award Two by Example.

patent:
  show: true
  order: 10
  title: Patents
  summary: |
    The patent section in a resume is a dedicated section where you can showcase any patents that you have been granted or are in the process of obtaining. This section is particularly relevant for individuals who work in scientific or technical fields, as well as for individuals who have developed innovative products or technologies.

    In this section, you should list the title of the patent, the name of the inventors, the patent number, and the date it was granted. If the patent is pending, you can indicate that it is "pending" or "in review." You may also want to provide a brief description of the technology or invention that the patent covers.

    Including a patent section in your resume can help demonstrate your expertise and accomplishments in your field, and can help you stand out from other candidates. However, if you do not have any patents to list, it is not necessary to include this section in your resume.

    Template for a pending patent:

    + [Inventor Name]. [Filing Year]. [Title]. [Patent Number], filed [Filing Date]. Patent pending.

    Template for an approved patent:

    + [Inventor Name]. [Filing Year]. [Title]. [Patent Number], filed [Filing Date], and granted [Grant Date].

    The following are some examples of patent formats.

    + Foo Bar. 2022. Example patent name one. US 123456, filed Oct 3, 2022. Patent pending.
    + Foo Bar. 2022. Example patent name two. US 654321, filed Oct 3, 2022, and issued Nov 15, 2022.

organization:
  show: true
  order: 11
  title: Organizations
  summary: |
    The organization section in a resume, specifically for social contexts, is a section where you can showcase any relevant involvement or leadership positions in social, cultural, or community organizations. This section can highlight your commitment to social causes and your ability to work collaboratively with others towards a common goal.

    In this section, you can list the name of the organization, your role and responsibilities, the duration of your involvement, and any significant achievements or accomplishments. You can also mention any skills or qualities you gained from your involvement, such as leadership, teamwork, communication, or problem-solving skills.

    This section can be especially valuable for candidates seeking positions in the non-profit sector, social work, or community engagement roles, where experience in social or cultural organizations can demonstrate a genuine passion for social causes and a willingness to work collaboratively towards social change. However, it is important to only include organizations that are relevant to the job you are applying for, and avoid listing organizations that may be controversial or potentially offensive.

language:
  show: true
  order: 12
  title: Languages
  summary: |
    The languages section in a resume typically includes information about your proficiency in different languages. This section can be particularly important if you are applying for a job that requires fluency or proficiency in a specific language.

    It's important to be honest about your language proficiency in your resume. If you overstate your abilities, it could lead to problems during the interview process or on the job. If you have taken language courses or earned language certifications, you can also include this information in the languages section of your resume.

  items:
    - idiom: Chinese
      show: true
      level: Native
    - idiom: English
      show: true
      level: Professional

interest:
  show: true
  order: 13
  title: Interests
  summary: |
    The interests section in a resume typically refers to a section where you can mention your hobbies, interests, and activities outside of work or school. This section can give potential employers a better idea of your personality, your values, and your interests beyond your professional experience.

    Including an interest section in your resume can be helpful if your interests are relevant to the job you are applying for, such as if you are applying for a job in a creative field and your hobbies include painting or writing. It can also be useful if you are applying for a job where teamwork or social skills are important, and you can mention interests that demonstrate those qualities.

    However, it is important to be selective when including an interest section in your resume, and to choose interests that are appropriate and professional. Avoid including controversial or potentially offensive interests, and focus on interests that showcase your positive qualities and strengths.

  items:
    - item: Reading
      show: true
      link: https://example.com/link/to/reading
    - item: Cooking
      show: true
      link:

evaluation:
  show: true
  order: 14
  title: Self-evaluation
  summary: |
    The self-evaluation section in a resume is a section where you can evaluate and assess your own skills, strengths, and weaknesses. It is typically a short paragraph or bullet points at the end of your resume, which provides a personal perspective on your abilities and how they align with the requirements of the job.

    In this section, you can highlight your achievements, areas of expertise, and any unique qualities or experiences that set you apart from other candidates. You can also mention areas where you are looking to improve or gain further experience.

    A well-crafted self-evaluation section can demonstrate your self-awareness and confidence in your abilities, as well as your willingness to continuously learn and grow. However, it is important to be honest and avoid over-inflating your skills or qualifications, as this can negatively impact your credibility and the hiring manager's impression of you.

reference:
  show: true
  order: 15
  title: References
  summary: |
    References are usually provided separately and only when requested. Choose people who know your professional or academic work, ask for their permission, and tell them about the role before sharing their details.

    **Privacy:** Do not publish a reference's home address, personal phone number, or private email address without explicit consent. On a public resume, omit contact details or write “References available upon request,” then share them privately with the employer.

